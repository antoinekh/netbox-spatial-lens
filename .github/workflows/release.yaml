name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the plugin
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Confirm the tag matches the package version
        if: github.event_name == 'release'
        run: |
          # A tag that disagrees with pyproject.toml publishes a version nobody expects.
          version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $version"
            exit 1
          fi

      - name: Point the README links at GitHub
        # PyPI shows the README as the project page and cannot resolve its relative links, so
        # the captures and docs pages are pointed at this release's tag (a manual run, at its
        # commit). The repository's README is left relative.
        run: python .github/scripts/pypi_readme.py "${{ github.event_name == 'release' && github.ref_name || github.sha }}"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the metadata
        run: |
          pip install twine
          twine check --strict dist/*

      - name: Upload the distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    # A manual run only builds and checks: publishing is for a GitHub release, whose tag the
    # build job has matched against the package version.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Trusted publishing: PyPI verifies this workflow's identity, so no API token is stored
    # in the repository. Configure it once at
    # https://pypi.org/manage/account/publishing/ (a pending publisher, before the first
    # release) and then at https://pypi.org/manage/project/netbox-spatial-lens/settings/publishing/
    environment:
      name: pypi
      url: https://pypi.org/p/netbox-spatial-lens
    permissions:
      id-token: write

    steps:
      - name: Download the distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
