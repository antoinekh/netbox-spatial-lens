# Development stack for netbox-spatial-lens on NetBox 4.7.
#
# Its own Compose project name, so it has its own database and volumes and can run beside the
# netbox-change-control stacks without touching them. Ports are shifted again for the same
# reason: 8890 for the web container and 5435 for PostgreSQL.
#
# Relative paths resolve against netbox-docker/, which is the Compose project directory,
# because the base file is passed first and Compose takes the project directory from it.
#
# Usage, from the plugin: `make up`. See the Makefile.

x-netbox: &netbox
  image: netboxcommunity/netbox:v4.7.0
  environment:
    # dev/ holds lens_examples, the colourings from docs/extending.md.
    PYTHONPATH: /opt/netbox/plugins/netbox-spatial-lens:/opt/netbox/plugins/netbox-spatial-lens/dev:/opt/netbox/plugins/netbox-branching
    # Read by dev/configuration/plugins.py. `make up BRANCHING=true` and `make up EXAMPLES=true` set them.
    NETBOX_BRANCHING: ${NETBOX_BRANCHING:-false}
    LENS_EXAMPLES: ${LENS_EXAMPLES:-false}
    DEVELOPER: "true"
    SKIP_SUPERUSER: "false"
    SUPERUSER_NAME: "admin"
    SUPERUSER_EMAIL: "admin@example.com"
    SUPERUSER_PASSWORD: "admin"
  volumes:
    # Only our own config file, mounted over netbox-docker's config directory rather than
    # replacing it. Replacing it meant vendoring copies of configuration.py, extra.py and
    # logging.py that we never edited and that would drift from netbox-docker's own.
    - ../netbox-spatial-lens/dev/configuration/plugins.py:/etc/netbox/config/plugins.py:z,ro
    - ../netbox-spatial-lens:/opt/netbox/plugins/netbox-spatial-lens:z
    # A sibling checkout, mounted read-only and only imported when NETBOX_BRANCHING is true.
    - ../netbox-branching:/opt/netbox/plugins/netbox-branching:z,ro

services:
  netbox:
    <<: *netbox
    ports:
      - "8890:8080"
    healthcheck:
      start_period: 600s
  netbox-worker:
    # The base file builds the worker from a YAML anchor resolved in that file, so overriding
    # `netbox` alone would leave the worker on the base image without our mount.
    <<: *netbox
    depends_on:
      netbox:
        condition: service_healthy
    command:
      - /opt/netbox/venv/bin/python
      - /opt/netbox/netbox/manage.py
      - rqworker
    healthcheck:
      test: ps -aux | grep -v grep | grep -q rqworker || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
  postgres:
    ports:
      - "5435:5432"
